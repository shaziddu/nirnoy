databases:
  - name: nirnoy_database
    region: singapore
    databaseName: tabbycat
    user: tabbycat
    plan: free

services:
  - type: web
    name: nirnoy_website
    env: python
    plan: free
    region: singapore
    buildCommand: "bash ./bin/render-compile.sh"
    startCommand: "bash ./bin/render-start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nirnoy_database
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: nirnoy_redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: nirnoy_redis
          property: port
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: 4
      - key: TAB_DIRECTOR_EMAIL
        sync: false
      - key: TIME_ZONE
        sync: false
      - key: ON_RENDER
        value: true
      - key: USING_NGINX
        value: 0 # Not 'false'; is cast
  - type: redis
    name: nirnoy_redis
    region: singapore
    ipAllowList: # required
      - source: 0.0.0.0
        description: everywhere
    plan: free
    maxmemoryPolicy: allkeys-lru # (default)
